# Сборка, юнит-тесты и GameTest (сервер с Create, Sable, Aeronautics с Modrinth); jar — в артефактах запуска
name: build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Моды для GameTest
        uses: actions/cache@v4
        with:
          path: mod/run/ci-mods
          key: runtime-mods-${{ hashFiles('tools/fetch_runtime_mods.py') }}
      - run: python3 ../tools/fetch_runtime_mods.py run/ci-mods

      - name: Сборка и юнит-тесты
        run: ./gradlew build --console=plain

      - name: GameTest
        run: |
          ./gradlew runGameTestServer -PmcModsDir=run/ci-mods --console=plain
          grep -E 'All [0-9]+ required tests passed' run/gametest/logs/latest.log

      - uses: actions/upload-artifact@v4
        with:
          name: airstrike-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error

      - name: Логи при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            mod/run/gametest/logs/
            mod/build/reports/
          if-no-files-found: ignore
