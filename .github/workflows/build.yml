# Сборка, юнит-тесты и GameTest (сервер с Create, Sable, Aeronautics с Modrinth); jar — в артефактах запуска.
# Ручной запуск на main (или на ветке claude/release-*, чтобы выпустить ровно проверенный коммит) с release=true:
# после всех проверок — релиз v<mod_version> на GitHub с этим jar и заметками из docs/releases/<mod_version>.md.
name: build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Выпустить релиз v<mod_version> (только с main или claude/release-*)
        type: boolean
        default: false

# пуш отменяет прежнюю сборку той же ветки; ручной запуск (релиз) — в своей группе, пуш в main его не отменит
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.run_id) || format('build-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # процессы стенда и мультиплеера гасятся целиком, без сирот (tools/rig_procs.sh), ~4 с; без Java и модов — своей задачей
  rig:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Остановка проверок
        timeout-minutes: 2
        run: tools/test_rig_procs.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Моды для GameTest
        uses: actions/cache@v4
        with:
          path: mod/run/ci-mods
          key: runtime-mods-${{ hashFiles('tools/fetch_runtime_mods.py') }}
      - run: python3 ../tools/fetch_runtime_mods.py run/ci-mods

      - name: Сборка и юнит-тесты
        run: ./gradlew build --console=plain

      - name: GameTest
        run: |
          ./gradlew runGameTestServer -PmcModsDir=run/ci-mods --console=plain
          grep -E 'All [0-9]+ required tests passed' run/gametest/logs/latest.log

      # у хоста Lithium: он подменяет цикл лучей Explosion.explode и PalettedContainer.count — миксины взрыва и блэкаут мода должны работать и с ним
      - name: GameTest с Lithium
        run: |
          ./gradlew runGameTestServer -PmcModsDir=run/ci-mods -PwithLithium --console=plain
          # строка о Lithium — в начале запуска: в полночь UTC лог уходит в архив (*.log.gz)
          shopt -s nullglob
          zgrep -hF 'Lithium 0.15.4' run/gametest/logs/latest.log run/gametest/logs/*.log.gz
          grep -E 'All [0-9]+ required tests passed' run/gametest/logs/latest.log

      - uses: actions/upload-artifact@v4
        with:
          name: airstrike-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error

      - name: Релиз
        if: github.event_name == 'workflow_dispatch' && inputs.release && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/release-'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^mod_version=//p' gradle.properties)
          gh release create "v$v" "build/libs/airstrike-$v.jar" --target "$GITHUB_SHA" \
            --title "Airstrike $v" --notes-file "../docs/releases/$v.md"

      - name: Логи при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            mod/run/gametest/logs/
            mod/build/reports/
          if-no-files-found: ignore
