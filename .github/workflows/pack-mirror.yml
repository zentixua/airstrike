# Зеркало сборки: pack/ здесь — копия pack/ из zentixua/airstrike-pack, где сборка живёт и правится. Экземпляры Prism
# со старым адресом сборки (raw.githubusercontent.com/zentixua/airstrike/main/pack/pack.toml) получают её отсюда, как
# прежде, без правки адреса. Копия — по расписанию и вручную (после слияния PR сборки его запускают сразу, не дожидаясь
# расписания); коммит — только когда сборка изменилась. README.md и .packwizignore зеркала свои: в индекс они не входят.
name: pack-mirror

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pack-updated]

concurrency:
  group: pack-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    name: Зеркало сборки
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # от этого репозитория нужна только pack/: без остальных файлов и их истории
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: pack
          filter: blob:none

      - uses: actions/checkout@v5
        with:
          repository: zentixua/airstrike-pack
          ref: main
          path: .pack-src
          persist-credentials: false

      - name: Копия pack/
        run: |
          src=$(git -C .pack-src rev-parse --short HEAD)
          find pack -mindepth 1 -maxdepth 1 ! -name README.md ! -name .packwizignore -exec rm -rf {} +
          tar -C .pack-src/pack --exclude=./README.md --exclude=./.packwizignore -cf - . | tar -C pack -xf -
          rm -rf .pack-src
          if [ -z "$(git status --porcelain -- pack/)" ]; then
            echo "Сборка та же, что в zentixua/airstrike-pack@$src" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- pack/
          git commit -q -m "Зеркало сборки: zentixua/airstrike-pack@$src"
          # main мог уйти вперёд: зеркало трогает только pack/, а её здесь больше никто не правит
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
          { echo "Зеркало обновлено: zentixua/airstrike-pack@$src"; echo; echo '```'; git show --stat --format= HEAD; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
