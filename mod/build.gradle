plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Проверки только для запусков из Gradle (GameTest, сценарий клиента): в jar мода не попадают
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // юнит-тесты чистых частей проверок (разбор сценария commands — CommandPlanTest)
    test {
        compileClasspath += sourceSets.devtest.output
        runtimeClasspath += sourceSets.devtest.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.ryanhcode' }
    }
    // Distant Horizons API (у DH своего maven нет; Modrinth отдаёт файлы проекта как maven)
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// Моды сборки «All of Create Aeronautics» для запусков из Gradle (Create, Sable, Aeronautics).
// NeoForge 1.21.1 работает на mojmap-именах, поэтому jar из mods/ подходят без ремаппинга.
// Путь переопределяется: -PmcModsDir=... или переменная MC_DIR (как в tools/paths.py).
def mcDir = System.getenv('MC_DIR') ?: "${System.getProperty('user.home')}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/All of Create Aeronautics/minecraft"
def mcModsDir = file(project.findProperty('mcModsDir') ?: "${mcDir}/mods")
def runtimeModPatterns = ['create-1.21.1-*.jar', 'sable-neoforge-1.21.1-*.jar', 'create-aeronautics-bundled-1.21.1-*.jar']
// сценарий клиента с Sodium и Iris, как у хоста (tools/client_scenario.sh nuke shaders)
def shaderModPatterns = System.getenv('AIRSTRIKE_SHADERS') ? ['sodium-neoforge-*.jar', 'iris-neoforge-*.jar'] : []
// ... и с Distant Horizons, как у хоста: рельеф карты наведения вдали (tools/client_scenario.sh target-map dh)
def dhModPatterns = System.getenv('AIRSTRIKE_DH') ? ['DistantHorizons-*.jar'] : []
// GameTest с Lithium, как у хоста (-PwithLithium): Lithium заменяет вызовы в тике блок-сущностей (BoundTickingBlockEntityMixin)
def lithiumModPatterns = project.hasProperty('withLithium') ? ['lithium-neoforge-*.jar'] : []

// каталог клиента сценария; в мультиплеере у каждого клиента свой (tools/mp_scenario.sh)
def scenarioDir = project.findProperty('scenarioDir') ?: 'run/scenario'

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        // клиент без окна для сценария проверки (см. src/devtest/.../ClientScenario и tools/client_scenario.sh)
        clientScenario {
            client()
            // мультиплеер (tools/mp_scenario.sh): у каждого клиента свой каталог и ник
            gameDirectory = project.file(scenarioDir)
            if (project.findProperty('scenarioUser')) programArguments.addAll '--username', project.findProperty('scenarioUser')
            if (System.getenv('AIRSTRIKE_MP_PORT')) systemProperty 'airstrike.mp.port', System.getenv('AIRSTRIKE_MP_PORT')
            // режим сценария (all, launch, nuke, fx, models…) — список в tools/client_scenario.sh
            systemProperty 'airstrike.scenario', System.getenv('AIRSTRIKE_SCENARIO') ?: 'all'
            // размер окна: AIRSTRIKE_SIZE=1920x1080 (трейлер), по умолчанию 1280x720
            def size = (System.getenv('AIRSTRIKE_SIZE') ?: '1280x720').split('x')
            programArguments.addAll '--width', size[0], '--height', size[1]
            // трейлер проверяет, что кадр ровно такой (окно в KWin иначе уменьшается на заголовок)
            systemProperty 'airstrike.frame', size.join('x')
            environment 'ALSOFT_CONF', project.file('run/scenario/alsoft.conf').absolutePath
            // паузы сборщика мусора — чтобы отличать их от медленного кода (run/scenario/logs/gc.log)
            jvmArgument "-Xlog:gc:file=${project.file("${scenarioDir}/logs/gc.log").absolutePath}:time,uptime"
            // профиль JFR по желанию: AIRSTRIKE_JFR=1 tools/client_scenario.sh nuke → run/scenario/logs/scenario.jfr
            if (System.getenv('AIRSTRIKE_JFR')) jvmArgument "-XX:StartFlightRecording=filename=${project.file('run/scenario/logs/scenario.jfr').absolutePath},settings=profile"
        }
        server {
            server()
            gameDirectory = project.file(project.findProperty('serverDir') ?: 'run/server')
            programArgument '--nogui'
        }
        // стенд нагрузки (tools/stress.sh): выделенный сервер с режиссёром и игроки-клиенты, см. src/devtest/.../stress
        stressServer {
            server()
            gameDirectory = project.file('run/stress/server')
            programArgument '--nogui'
            systemProperty 'airstrike.stress', System.getenv('AIRSTRIKE_STRESS') ?: 'run'
            systemProperty 'airstrike.stress.players', System.getenv('AIRSTRIKE_STRESS_PLAYERS') ?: '3'
            systemProperty 'airstrike.stress.restart', System.getenv('AIRSTRIKE_STRESS_RESTART') ?: 'false'
            systemProperty 'airstrike.stress.probes', System.getenv('AIRSTRIKE_STRESS_PROBES') ?: 'true'
            jvmArgument "-Xlog:gc:file=${project.file('run/stress/server/gc.log').absolutePath}:time,uptime"
            // профиль JFR сервера по желанию, как у сценария клиента: AIRSTRIKE_JFR=1 tools/stress.sh → run/stress/server/stress.jfr
            if (System.getenv('AIRSTRIKE_JFR')) jvmArgument "-XX:StartFlightRecording=filename=${project.file('run/stress/server/stress.jfr').absolutePath},settings=profile"
            // сервер и три клиента на одной машине: без предела каждая JVM берёт ¼ памяти, и ядро убивает клиента.
            // AIRSTRIKE_RIG_JVM=artem — сервер с JVM, как в игре у Артёма (8 ГБ, поколенческий ZGC), только где хватает
            // памяти (VPS): 8 ГБ сервера и три клиента по 2 ГБ облако на 15 ГБ не вынесет. Режиссёр пишет сборщик в лог
            // и не запускается, если JVM стенда (тулчейн Gradle) работает с другим сборщиком (airstrike.stress.gc —
            // начало имени MXBean: у поколенческого ZGC «ZGC Minor/Major …», у прежнего — «ZGC Cycles») или с кучей
            // меньше заказанной (airstrike.stress.heap, МБ)
            def rigJvm = System.getenv('AIRSTRIKE_RIG_JVM') ?: 'default'
            if (rigJvm == 'artem') {
                ['-Xmx8g', '-XX:+UseZGC', '-XX:+ZGenerational'].each { jvmArgument it }
                systemProperty 'airstrike.stress.gc', 'ZGC Minor'
                systemProperty 'airstrike.stress.heap', '8192'
            } else if (rigJvm == 'default') {
                jvmArgument '-Xmx4g'
            } else {
                throw new GradleException("AIRSTRIKE_RIG_JVM=${rigJvm}: ожидается artem или default")
            }
        }
        stressClient {
            client()
            def name = System.getenv('AIRSTRIKE_STRESS_NAME') ?: 'Host'
            gameDirectory = project.file("run/stress/${name}")
            // сервер стенда слушает только петлю, порт — свободный, его выбирает tools/stress.sh
            def server = "127.0.0.1:${System.getenv('AIRSTRIKE_STRESS_PORT') ?: '25565'}"
            programArguments.addAll '--username', name, '--quickPlayMultiplayer', server, '--width', '854', '--height', '480'
            systemProperty 'airstrike.stress.server', server
            systemProperty 'airstrike.stress.client', System.getenv('AIRSTRIKE_STRESS_ROLE') ?: 'friend'
            jvmArgument '-Xmx2g'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Сценарии полёта (gametest/scenario): все зёрна (-PscenarioSeeds, по умолчанию 16) без остальных GameTest —
        // шаблон сценариев в своём пространстве имён airstrike_sweep. -PscenarioOnly=<регулярное выражение> — только
        // подходящие сценарии; -PscenarioRealChunks — настоящая загрузка чанков в темпе игры, без эталона
        scenarioSweep {
            type = 'gameTestServer'
            gameDirectory = project.file('run/scenario-sweep')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'airstrike_sweep'
            systemProperty 'airstrike.scenario.sweep', 'true'
            systemProperty 'airstrike.scenario.seeds', (project.findProperty('scenarioSeeds') ?: '16').toString()
            systemProperty 'airstrike.scenario.only', (project.findProperty('scenarioOnly') ?: '').toString()
            systemProperty 'airstrike.scenario.realChunks', project.hasProperty('scenarioRealChunks').toString()
        }
        // Записать эталон траекторий заново (зерно 0): src/devtest/resources/scenario-baseline.json
        scenarioRecord {
            type = 'gameTestServer'
            gameDirectory = project.file('run/scenario-record')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'airstrike_sweep'
            systemProperty 'airstrike.scenario.sweep', 'true'
            systemProperty 'airstrike.scenario.record', project.file('src/devtest/resources/scenario-baseline.json').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}
// -Xlog:gc пишет в logs/ каталога запуска, а JVM сама каталог не создаёт и не стартует без него (свежий клон, облако)
tasks.matching { it.name == 'runClientScenario' }.configureEach { doFirst { project.file("${scenarioDir}/logs").mkdirs() } }
tasks.matching { it.name == 'runStressServer' }.configureEach { doFirst { project.file('run/stress/server').mkdirs() } }
neoForge.addModdingDependenciesTo(sourceSets.devtest)
// юнит-тесты кода, который держит данные в классах Minecraft (Vec3, NBT), без запуска игры
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // Sable: только API для компиляции; во время игры он есть в сборке
    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"
    // sable-companion (MIT): мягкая зависимость — без Sable работает встроенная заглушка
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    // Distant Horizons: только API для компиляции — рельеф вдали для карты наведения, если DH стоит (compat/DistantHorizons)
    compileOnly "maven.modrinth:distanthorizonsapi:${dh_api_version}"
    // диапазон, а не ровно версия: Sable несёт тот же companion со своим диапазоном, и FML выбирает одну версию,
    // подходящую всем, — ровно [1.6.0] не пустил бы игру с Sable, который принесёт 1.6.1
    jarJar("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}") {
        version { strictly "[${sable_companion_version},2.0)"; prefer sable_companion_version }
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // SoundAssetsTest читает sounds.json
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

// Порядок сборки модов для запусков из Gradle. simulated, offroad и aeronautics (всё из Create Aeronautics) в своих
// конструкторах добавляют обратные вызовы в реестр Create (CreateRegistrateRegistrationCallback), а зависимость
// на create у них с ordering "NONE": FML строит их параллельно с Create и друг с другом, и HashMultimap обратных
// вызовов Registrate портится от одновременной записи. В dev (не production) Registrate тогда падает на старте:
// «Found unused register callbacks» (CI, 29.09.2026). Переопределение зависимостей FML (dependencyOverrides в
// config/fml.toml, штатная настройка загрузчика) ставит их строго друг за другом после Create: гонки нет, остальные
// моды по-прежнему строятся параллельно. В игре хоста fml.toml не трогаем: там Registrate от этого не падает.
def fmlDependencyOverrides = """# Пишет build.gradle перед каждым запуском (файл целиком); остальные ключи FML дополнит сам значениями по умолчанию
[dependencyOverrides]
simulated = ["+create", "+sable"]
offroad = ["+simulated"]
aeronautics = ["+simulated", "+offroad"]
"""
def writeFmlOverrides = { File gameDir ->
    // без Create Aeronautics в сборке запуска переопределять нечего
    if (!(mcModsDir.isDirectory() && mcModsDir.list().any { it.contains('aeronautics') })) return
    File config = new File(gameDir, 'config/fml.toml')
    config.parentFile.mkdirs()
    config.text = fmlDependencyOverrides
}
// перед каждым запуском из Gradle (клиент, сервер, GameTest, сценарий, стенд): каталог игры — у самой задачи запуска
tasks.matching { it.name.startsWith('run') && it.hasProperty('gameDirectory') }.configureEach { task ->
    task.doFirst { writeFmlOverrides(task.gameDirectory.get().asFile) }
}

// Запуск без живого Gradle (стенд tools/stress.sh, мультиплеер tools/mp_scenario.sh): процесс Gradle держит UDP-сокет
// блокировок файлов (DefaultFileLockCommunicator) на 0.0.0.0, и адрес ему не задать. Серверы и клиенты проверок
// поэтому идут не задачей run*, а скриптом, который пишет эта задача: ./gradlew rigLaunch -PrigRun=runStressServer
// -PrigOut=stress-server → build/rig/stress-server.sh (тот же java, аргументы, classpath, каталог и окружение, что
// у задачи запуска; файлы аргументов MDG копируются: у клиентов стенда он один на всех). Gradle выходит, игра — нет.
tasks.register('rigLaunch') {
    def runName = project.findProperty('rigRun')
    def out = project.findProperty('rigOut')
    if (runName) dependsOn { tasks.named(runName as String).get().taskDependencies }
    doFirst {
        // без имени скрипта остался бы прежний build/rig/<имя>.sh, и скрипт проверки запустил бы устаревший запуск
        if (!runName || !out) throw new GradleException('rigLaunch needs -PrigRun and -PrigOut')
    }
    doLast {
        def run = tasks.named(runName as String).get()
        File dir = layout.buildDirectory.dir('rig').get().asFile
        dir.mkdirs()
        // @файл MDG — копия под своим именем: следующий rigLaunch того же запуска (другой клиент стенда) его перепишет
        def own = { String arg ->
            if (!arg.startsWith('@')) return arg
            File src = file(arg.substring(1))
            File copy = new File(dir, "${out}-${src.name}")
            copy.bytes = src.bytes
            return '@' + copy.absolutePath
        }
        List<String> cmd = [run.javaLauncher.get().executablePath.asFile.absolutePath]
        // allJvmArgs у JavaExec не несёт явных jvmArgs задачи, а в них @файл MDG (модули, --add-opens, -D запуска)
        cmd += ((run.jvmArgs ?: []) + run.allJvmArgs.findAll { !(it in (run.jvmArgs ?: [])) }).collect(own)
        cmd += ['-cp', run.classpathProvider.asPath, run.mainClass.get()]
        cmd += (run.args + run.argumentProviders.collectMany { it.asArguments() as List }).collect(own)
        def quote = { String v -> "'" + v.replace("'", "'\\''") + "'" }
        File gameDir = run.gameDirectory.get().asFile
        writeFmlOverrides(gameDir)
        File script = new File(dir, "${out}.sh")
        script.text = "#!/usr/bin/env bash\n# ${runName} без Gradle: пишет ./gradlew rigLaunch (build.gradle)\n" +
                "mkdir -p ${quote(gameDir.absolutePath)}/logs && cd ${quote(gameDir.absolutePath)} || exit 1\n" +
                "exec env ${run.environmentProperty.get().collect { k, v -> quote("${k}=${v}") }.join(' ')} ${cmd.collect(quote).join(' ')}\n"
        script.setExecutable(true)
    }
}

// Копирует моды сборки в каталог запуска: FML сам распакует вложенные jar (Flywheel, Ponder, Veil…)
def copyRuntimeMods = { String runDir ->
    tasks.register("copyRuntimeMods_${runDir}", Sync) {
        def patterns = runDir == 'scenario' ? runtimeModPatterns + shaderModPatterns + dhModPatterns
                : runDir in ['gametest', 'scenario-sweep', 'scenario-record'] ? runtimeModPatterns + lithiumModPatterns : runtimeModPatterns
        from(mcModsDir) { patterns.each { include it } }
        into({ "${project.findProperty(runDir + 'Dir') ?: 'run/' + runDir}/mods" })
        onlyIf { mcModsDir.isDirectory() }
    }
}
['client', 'server', 'gametest', 'scenario', 'scenario-sweep', 'scenario-record'].each { copyRuntimeMods(it) }
tasks.register('copyRuntimeMods_stress', Sync) {
    from(mcModsDir) { runtimeModPatterns.each { include it } }
    into "run/stress/mods"
    onlyIf { mcModsDir.isDirectory() }
}
tasks.matching { it.name in ['runStressServer', 'runStressClient'] }.configureEach { dependsOn 'copyRuntimeMods_stress' }
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'copyRuntimeMods_client' }
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'copyRuntimeMods_server' }
tasks.matching { it.name == 'runClientScenario' }.configureEach { dependsOn 'copyRuntimeMods_scenario' }
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'copyRuntimeMods_gametest' }
tasks.matching { it.name == 'runScenarioSweep' }.configureEach { dependsOn 'copyRuntimeMods_scenario-sweep' }
tasks.matching { it.name == 'runScenarioRecord' }.configureEach { dependsOn 'copyRuntimeMods_scenario-record' }
// Мир GameTest — каждый раз новый, как в CI: площадки сценариев полёта стоят на одних и тех же координатах, и рельеф,
// аппараты и чанки прошлого прогона меняли бы полёт против эталона
tasks.matching { it.name in ['runGameTestServer', 'runScenarioSweep', 'runScenarioRecord'] }.configureEach { task ->
    doFirst { project.delete(new File(task.gameDirectory.get().asFile, 'world')) }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description, mod_url: mod_url, sable_version: sable_version,
        dh_version_range: dh_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}

// Тестовая сборка для боевого клиента (tools/prod_client.py): мод вместе со сценариями из devtest.
// Отдельный каталог, чтобы deploy.sh и релиз никогда не взяли её вместо обычного jar.
tasks.register('scenarioJar', Jar) {
    dependsOn tasks.named('jar')
    archiveClassifier = 'scenario'
    destinationDirectory = layout.buildDirectory.dir('scenario-libs')
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile }))
    from(sourceSets.devtest.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
