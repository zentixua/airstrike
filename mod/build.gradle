plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Проверки только для запусков из Gradle (GameTest, сценарий клиента): в jar мода не попадают
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
    devtestImplementation.extendsFrom implementation
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroupAndSubgroups 'dev.ryanhcode' }
    }
    mavenCentral()
}

// Моды сборки «All of Create Aeronautics» для запусков из Gradle (Create, Sable, Aeronautics).
// NeoForge 1.21.1 работает на mojmap-именах, поэтому jar из mods/ подходят без ремаппинга.
// Путь переопределяется: -PmcModsDir=... или переменная MC_DIR (как в tools/paths.py).
def mcDir = System.getenv('MC_DIR') ?: "${System.getProperty('user.home')}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/All of Create Aeronautics/minecraft"
def mcModsDir = file(project.findProperty('mcModsDir') ?: "${mcDir}/mods")
def runtimeModPatterns = ['create-1.21.1-*.jar', 'sable-neoforge-1.21.1-*.jar', 'create-aeronautics-bundled-1.21.1-*.jar']

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        // клиент без окна для сценария проверки (см. src/devtest/.../ClientScenario и tools/client_scenario.sh)
        clientScenario {
            client()
            gameDirectory = project.file('run/scenario')
            systemProperty 'airstrike.scenario', 'all'
            programArguments.addAll '--width', '1280', '--height', '720'
            environment 'ALSOFT_CONF', project.file('run/scenario/alsoft.conf').absolutePath
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devtest)

dependencies {
    // Sable: только API для компиляции; во время игры он есть в сборке
    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"
    // sable-companion (MIT): мягкая зависимость — без Sable работает встроенная заглушка
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    jarJar("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}") {
        version { strictly "[${sable_companion_version}]"; prefer sable_companion_version }
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Копирует моды сборки в каталог запуска: FML сам распакует вложенные jar (Flywheel, Ponder, Veil…)
def copyRuntimeMods = { String runDir ->
    tasks.register("copyRuntimeMods_${runDir}", Sync) {
        from(mcModsDir) { runtimeModPatterns.each { include it } }
        into "run/${runDir}/mods"
        onlyIf { mcModsDir.isDirectory() }
    }
}
['client', 'server', 'gametest', 'scenario'].each { copyRuntimeMods(it) }
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'copyRuntimeMods_client' }
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'copyRuntimeMods_server' }
tasks.matching { it.name == 'runClientScenario' }.configureEach { dependsOn 'copyRuntimeMods_scenario' }
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'copyRuntimeMods_gametest' }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-serial,-classfile,-this-escape', '-Xmaxerrs', '1000']
}
