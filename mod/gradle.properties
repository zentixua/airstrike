# gradle.properties читается в ISO-8859-1: не-ASCII — только \uXXXX; описание — по-английски (список модов, Modrinth)
mod_description=Cinematic, realistic airstrikes for Create Aeronautics worlds: Shahed-style kamikaze drones, cruise missiles, MLRS rocket salvos, Lancet-style loitering munitions, a B-2 with a bunker buster and an ICBM with a nuclear warhead. Aim with the designator binoculars at blocks, mobs, players or aircraft, and follow the strike from the projectile camera.
