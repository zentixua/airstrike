org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Версии совпадают со сборкой «All of Create Aeronautics» (NeoForge 21.1.250, MC 1.21.1)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

sable_version=2.0.5
sable_companion_version=1.6.0
# API Distant Horizons 3.3.3 (DhApi.getApiMajorVersion() == 7)
dh_api_version=7.2.0
# Distant Horizons (необязателен): API 7, проверено на 3.3.3; DH старше 3.3 NeoForge не пустит в игру вместе с модом
dh_version_range=[3.3,)

mod_id=airstrike
mod_name=Airstrike
mod_license=All Rights Reserved
mod_version=2.4.1
mod_group_id=ua.zentix.airstrike
mod_authors=ZentixUA
mod_url=https://github.com/zentixua/airstrike
# gradle.properties читается в ISO-8859-1: не-ASCII — только \uXXXX; описание — по-английски (список модов, Modrinth)
mod_description=Airstrikes for Minecraft 1.21.1, made for the All of Create Aeronautics modpack: Shahed-style kamikaze drones, Lancet-style loitering munitions, cruise missiles, MLRS rocket salvos, a B-2 with a bunker buster and an ICBM with a nuclear warhead. Aim the designator binoculars at blocks, mobs, players or Create Aeronautics aircraft, or pick a spot on the targeting map.
