modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# открывает Channel.source, SoundManager.soundEngine и SoundEngine.instanceToChannel (фильтр OpenAL: воздух,
# преграды, оглушение) и ChunkMap.getChunks (все загруженные чанки)
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

# защита от краша Sable при дроблении аппарата (compat/SplitGuard); без Sable не применяется
[[mixins]]
config = "airstrike.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Sable и Create Aeronautics — не обязательны: без них аппаратов просто нет
[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[${sable_version},)"
ordering = "AFTER"
side = "BOTH"
