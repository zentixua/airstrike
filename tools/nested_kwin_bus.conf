<!-- Шина D-Bus вложенного KWin (её поднимает dbus-run-session в tools/nested_kwin.sh). Как session.conf самого dbus,
     но без каталогов служб (standard_session_servicedirs), то есть без D-Bus-активации: шина не запускает служб
     по первому вызову, на ней только процессы самой сессии (KWin, Xwayland, клиент); вызов имени без владельца
     получает ошибку org.freedesktop.DBus.Error.ServiceUnknown.

     Зачем: XDG_RUNTIME_DIR у вложенной сессии общий с рабочим столом, и служба рабочего стола, запущенная этой шиной,
     хозяйничает в нём как у себя. По вызову из сессии шина поднимала xdg-desktop-portal, он — xdg-document-portal,
     а тот при старте снимал маунт хоста $XDG_RUNTIME_DIR/doc (fusermount3 -u -z: FUSE на месте он считает
     оставшимся от себя прежнего), при выходе — свой; flatpak-приложения хоста после этого не запускались
     («bwrap: Can't find source path /run/user/1000/doc/by-app/…»). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
